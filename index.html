<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLAT Drill</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--fg:#16202e;--mut:#5d6878;--card:#fff;--bd:#d9dfe7;--ac:#2b4acb;--acf:#fff;--ok:#16743f;--okb:#e2f3e8;--no:#b3261e;--nob:#fbe8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#12161d;--fg:#e8ecf2;--mut:#98a3b3;--card:#1a2029;--bd:#2d3643;--ac:#7b93ff;--acf:#0d1220;--ok:#6fd49a;--okb:#16301f;--no:#ff8f86;--nob:#3a1c1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 56px}
h2{font:600 22px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 12px}
h3{font-size:14px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:13px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer}
nav button.on{color:var(--fg);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn,.ghost,.chip{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:9px 14px;cursor:pointer;background:var(--card);color:var(--fg)}
.btn{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.chip.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.stem{font:19px/1.55 Georgia,"Times New Roman",serif;white-space:pre-wrap;margin:14px 0 16px}
.qh{display:flex;justify-content:space-between;gap:12px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt b{min-width:18px;color:var(--mut)}
.opt.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.opt.right{background:var(--okb);border-color:var(--ok)}
.opt.wrong{background:var(--nob);border-color:var(--no)}
.fb{padding:10px 14px;border-radius:8px;margin:12px 0}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.score{font:600 44px/1 Georgia,serif;margin:6px 0 16px}.score span{font:15px system-ui;color:var(--mut)}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
input[type=range]{width:100%}
.msg{background:var(--card);border-left:3px solid var(--ac);padding:8px 12px;margin-bottom:12px;font-size:14px}
.tp{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.pin{background:none;border:0;font-size:18px;line-height:1;cursor:pointer;color:var(--mut);padding:0 2px}.pin.on{color:var(--ac)}
.bar{margin-bottom:10px}.bl{font-size:13px}.bt{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0}.bf{height:100%;background:var(--no)}
.cat{border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:8px 12px;margin-bottom:8px}.cat summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
select{font:inherit;font-size:13px;max-width:130px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 4px}
textarea,input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.fl{display:block;margin:12px 0 4px;font-size:13px;color:var(--mut)}.fl select{width:100%;max-width:none;padding:8px}
.orow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.orow input[type=text]{flex:1}
.hide{display:none}
</style></head>
<body><main id="app"></main>
<input type="file" id="file-q" class="hide" accept=".md,.markdown,.txt" multiple>
<input type="file" id="file-k" class="hide" accept=".md,.markdown,.txt,.csv">
<input type="file" id="file-t" class="hide" accept=".md,.markdown,.txt" multiple>
<input type="file" id="file-r" class="hide" accept=".md,.markdown,.txt">
<input type="file" id="file-b" class="hide" accept=".json,application/json">
<script>
(function(){
'use strict';
var MON=['january','february','march','april','may','june','july','august','september','october','november','december'];
var LET='ABCDEFGH';
/* ---------- parsing ---------- */
function unesc(s){return s.replace(/\\([\\`*_{}\[\]()#+\-.!|<>~'"&])/g,'$1')}
function detMonth(text,fn){
  var re=/(?<![A-Za-z])(january|february|march|april|may|june|july|august|september|october|november|december)[\s_,\-]*(\d{4})(?!\d)/i;
  var tl=(text.match(/^#\s+.*$/m)||[''])[0];
  var m=tl.match(re)||fn.match(re)||text.slice(0,2000).match(re);
  if(!m)return null;
  var mi=MON.indexOf(m[1].toLowerCase()),y=+m[2];
  return{key:y+'-'+('0'+(mi+1)).slice(-2),label:m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase()+' '+y};
}
function parseQ(text,fn,loose){
  var L=text.replace(/\r/g,'').split('\n'),mo=detMonth(text,fn),topics=[],qs=[],cur=null,inO=false,prevO=false,tp=loose?{no:0,title:'Imported'}:null,warn=[];
  var qRe=/^\*\*(\d+)\.\*\*\s*(.*)$/,oRe=/^[-*+]\s+\(?([a-hA-H])\)\s*(.*)$/,tRe=/^###\s+(\d+)\.\s+(.+)$/;
  function close(){
    if(!cur)return;
    cur.q=unesc(cur.q.trim());cur.o=cur.o.map(function(o){return unesc(o.trim())});
    if(cur.k>=cur.o.length)cur.k=-1;if(cur.o.length<2)warn.push('Topic '+cur.tn+', Q'+cur.n+' has '+cur.o.length+' option(s)');
    cur=null;inO=false;prevO=false;
  }
  L.forEach(function(raw){
    var t=raw.trim(),m;
    if(!t){prevO=false;return}
    if((m=t.match(tRe))){close();tp={no:+m[1],title:unesc(m[2].trim())};topics.push(tp);return}
    if(/^##\s/.test(t)){close();return}
    if(!tp)return;
    if((m=t.match(qRe))){close();cur={tn:tp.no,t:tp.title,n:+m[1],q:m[2],o:[],k:-1};qs.push(cur);return}
    if(cur&&(m=t.match(oRe))){inO=true;prevO=true;cur.o.push(m[2]);return}
    if(cur&&(m=t.replace(/\*\*/g,'').match(/^(?:correct\s+)?(?:answer|ans)\s*[:\-–]?\s*\(?([a-hA-H])\)?(?=$|[\s.,;:)\-–—])/i))){cur.k='abcdefgh'.indexOf(m[1].toLowerCase());prevO=false;return}
    if(cur){if(!inO)cur.q+='\n'+t;else if(prevO&&cur.o.length)cur.o[cur.o.length-1]+=' '+t}
  });

  var slug=fn.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'file';
  return{key:mo?mo.key:'x-'+slug,label:mo?mo.label:fn.replace(/\.[^.]+$/,'').replace(/_/g,' '),topics:topics,qs:qs,warn:warn};
}
var P='(?:Q\\.?\\s*)?\\d{1,3}\\s*[-–—.):=]?\\s*\\(?[a-dA-D]\\)?';
var WHOLE=new RegExp('^'+P+'(?:[\\s,;]+'+P+')+[\\s,;.]*$');
var SINGLE=/^(?:Q\.?\s*)?(\d{1,3})\s*[-–—.):=]*\s*(?:\(([a-dA-D])\)|([a-dA-D])(?=\s*$|\s*[.,;:)\-–—|]))/;
var ANS=/^(?:correct\s+)?(?:answer|ans|key)\s*[:\-–]?\s*\(?([a-dA-D])\)?(?=$|[\s.,;:)\-–—])/i;
function parseKey(text,topics){
  var g=-1,prev=0,curQ=null,map={},cnt=0;
  function put(n,l){
    var k='abcd'.indexOf(l.toLowerCase());if(k<0)return;
    if(g<0||(n===1&&prev>1))g++;
    prev=n;var tp=topics[g];if(!tp)return;
    map[tp.no+'.'+n]=k;cnt++;
  }
  text.replace(/\r/g,'').split('\n').forEach(function(raw){
    var r=raw.trim();if(!r||/^#/.test(r))return;
    var ql=r.match(/^\*\*(\d+)\.\*\*/);if(ql)curQ=+ql[1];
    var c=r.replace(/\*\*/g,'').replace(/^[-*•+]\s+/,'').replace(/\|/g,' ').replace(/\s+/g,' ').trim(),m;
    if(!c)return;
    if(WHOLE.test(c)){
      var pg=/(?:Q\.?\s*)?(\d{1,3})\s*[-–—.):=]?\s*\(?([a-dA-D])\)?/g;
      while((m=pg.exec(c)))put(+m[1],m[2]);
      return;
    }
    if((m=c.match(SINGLE))){put(+m[1],m[2]||m[3]);curQ=+m[1];return}
    if(curQ!=null&&(m=c.match(ANS)))put(curQ,m[1]);
  });
  return{map:map,count:cnt,groups:g+1};
}
/* ---------- option shuffling ---------- */
var BAD=[/\b(all|none|neither|either|any|both)\s+of\s+(the\s+)?(above|these|them|those|following|options)\b/i,/\ball\s+the\s+above\b/i,
/\b(both|either)\s+\(?[a-d]\)?\s*(and|&|or)\s*\(?[a-d]\)?(?![\w])/i,/^\(?[a-d]\)?\s*(and|&|,|or)\s*\(?[a-d]\)?/i,/\(\s*[a-d]\s*\)/i,
/\b(above|previous|preceding)\s+(statement|option|answer)s?\b/i,/\b(assertion|reason|statement)s?\b/i,/^(both|neither|none|all)\b/i,/\bboth\s+(\d|[ivx]+\b)/i,
/^(only\s+)?(statements?\s+)?([ivx]+|\d+)(\s*(and|,|&)\s*([ivx]+|\d+))+(\s+only)?$/i,/^(only\s+)?([ivx]+|\d)\s+only$|^only\s+([ivx]+|\d)$/i];
function ordered(o){
  var v=o.map(function(s){var n=String(s).trim().match(/^[^\d]{0,12}?(\d[\d,]*(?:\.\d+)?)/);return n?parseFloat(n[1].replace(/,/g,'')):null});
  if(v.some(function(x){return x==null}))return false;
  var up=true,dn=true;
  for(var i=1;i<v.length;i++){if(v[i]<v[i-1])up=false;if(v[i]>v[i-1])dn=false}
  return up||dn;
}
function canShuf(q){
  for(var i=0;i<q.o.length;i++)for(var j=0;j<BAD.length;j++)if(BAD[j].test(q.o[i]))return false;
  return !ordered(q.o);
}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
/* ---------- state ---------- */
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function loadRev(){var n=ld('cq_rev2',null);if(n)return n;var o=ld('cq_rev',{}),ks=Object.keys(o);if(!ks.length)return[];return[{id:'old',ts:0,total:0,items:ks.map(function(id){var r=o[id];return{id:id,t:r.t,q:r.q,ans:r.ans,pick:r.pick,s:r.s||'',why:'wrong'}})}]}
var S={files:ld('cq_files',{}),hist:ld('cq_hist',{}),obs:ld('cq_obs',{}),pins:ld('cq_pins',{}),rev:loadRev(),cat:ld('cq_cat',{}),coll:ld('cq_coll',{}),catEdit:false,lastBk:ld('cq_bk',0),draft:{mk:'',tn:'',nt:'',q:'',o:['','','',''],k:-1},note:'',tab:'practice',cfg:{ev:false,m:{},t:{},st:'all',n:25,sh:50,fb:'instant'},qz:null,msg:[],kp:null,keyFor:null};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function months(){return Object.keys(S.files).sort()}
function persist(){if(!sv('cq_files',S.files))S.msg.push('Browser storage is full. Remove a file to make room.')}
function topicList(){var m={};months().forEach(function(k){S.files[k].qs.forEach(function(q){m[q.t]=(m[q.t]||0)+(q.k>=0?1:0)})});return Object.keys(m).map(function(t){return{t:t,n:m[t]}}).sort(function(a,b){return(S.pins[b.t]?1:0)-(S.pins[a.t]?1:0)})}
function getPool(){
  var c=S.cfg,o=[];
  months().forEach(function(mk){
    if(c.m[mk]===false)return;
    S.files[mk].qs.forEach(function(q){
      if(q.k<0||c.t[q.t]===false||S.obs[mk+'.'+q.tn+'.'+q.n])return;
      var h=S.hist[mk+'.'+q.tn+'.'+q.n];
      if(c.st==='unseen'&&h)return;
      if(c.st==='missed'&&!(h&&h.l==='w'))return;
      o.push({q:q,mk:mk});
    });
  });
  return o;
}
/* ---------- views ---------- */
function msgs(){var h=S.msg.map(function(m){return'<div class="msg">'+esc(m)+'</div>'}).join('');S.msg=[];return h}
var CATS=[['International',/international|world|global|foreign|diplomac|bilateral|summit|united nations|\bun\b|geopolit|conflict|treaty|brics|g20|nato|asean|saarc/i],
['Legal',/legal|\blaw|court|judic|judg(e)?ment|tribunal|legislat|\bbills?\b|\bacts?\b/i],
['Polity & Governance',/polity|govern|constitution|parliament|election|polic(y|ies)|scheme|ministry|cabinet|administr|federal|political/i],
['Economy',/econom|business|financ|bank|trade|budget|gdp|market|\brbi\b|\btax|industr|corporate/i],
['Environment',/environment|climate|ecolog|wildlife|biodivers|pollution|energy|forest/i],
['Science & Tech',/science|tech|space|isro|health|\bai\b|digital|cyber|research/i],
['Sports',/sport|olympic|cricket|games|tournament|athlet|fifa/i],
['Awards & Culture',/award|honou?r|prize|\bbooks?\b|author|\barts?\b|culture|festival|heritage|obituar|appoint/i]];
var CATN=CATS.map(function(x){return x[0]}).concat(['Other']);
function catOf(t){if(S.cat[t])return S.cat[t];for(var i=0;i<CATS.length;i++)if(CATS[i][1].test(t))return CATS[i][0];return'Other'}
function topicRow(x,i){
  var h='<div class="tp"><label class="ck"><input type="checkbox" data-ti="'+i+'"'+(S.cfg.t[x.t]===false?'':' checked')+'>'+esc(x.t)+' ('+x.n+')</label>';
  if(S.catEdit&&!S.pins[x.t])h+='<select data-tc="'+i+'" aria-label="Category">'+CATN.map(function(n){return'<option'+(n===catOf(x.t)?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
  return h+'<button class="pin'+(S.pins[x.t]?' on':'')+'" data-act="pin" data-ti="'+i+'" aria-label="Pin topic" aria-pressed="'+!!S.pins[x.t]+'">'+(S.pins[x.t]?'\u2605':'\u2606')+'</button></div>';
}
function catBlock(name,items,tl){
  var n=items.filter(function(x){return S.cfg.t[x.t]!==false}).length;
  var h='<details class="cat" data-cat="'+esc(name)+'"'+(S.coll[name]?'':' open')+'><summary><b>'+esc(name)+'</b> <span class="sub">'+n+' of '+items.length+' selected</span></summary><div class="row" style="margin:6px 0"><button class="ghost" data-act="catall" data-cat="'+esc(name)+'">Select all</button><button class="ghost" data-act="catnone" data-cat="'+esc(name)+'">Clear</button></div><div class="grid">';
  items.forEach(function(x){h+=topicRow(x,tl.indexOf(x))});
  return h+'</div></details>';
}
var SCHEMA=2;
function saveFile(name,data){
  var use=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
  return Promise.resolve(use).catch(function(){return null}).then(function(d){
    if(d)return d.save({filename:name,data:data});
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  });
}
function bkNag(){var d=(Date.now()-(S.lastBk||0))/864e5;return d>7&&(Object.keys(S.hist).length||revCount())?' <b>'+(S.lastBk?'Last backup was '+Math.floor(d)+' days ago.':'No backup yet.')+'</b> Export one from the Library tab.':''}
function bkExport(){
  var o={app:'clat-drill',schema:SCHEMA,saved:new Date().toISOString(),files:S.files,hist:S.hist,obs:S.obs,pins:S.pins,rev:S.rev,cat:S.cat,coll:S.coll};
  saveFile('clat-drill-backup-'+o.saved.slice(0,10)+'.json',JSON.stringify(o)).then(function(){S.lastBk=Date.now();sv('cq_bk',S.lastBk);S.msg.push('Backup file created. Keep it somewhere safe.');render()},function(e){if(!e||e.code!=='declined'){S.msg.push('Backup failed.');render()}});
}
function bkApply(o){
  S.files=o.files;S.hist=o.hist||{};S.obs=o.obs||{};S.pins=o.pins||{};S.rev=Array.isArray(o.rev)?o.rev:[];S.cat=o.cat||{};S.coll=o.coll||{};
  persist();sv('cq_hist',S.hist);sv('cq_obs',S.obs);sv('cq_pins',S.pins);sv('cq_rev2',S.rev);sv('cq_cat',S.cat);sv('cq_coll',S.coll);
}
function draw(pool,n,even){
  var p=shuf(pool.slice());
  if(!n||n>=p.length)return p;
  if(!even)return p.slice(0,n);
  var g={};p.forEach(function(x){(g[x.q.t]=g[x.q.t]||[]).push(x)});
  var keys=Object.keys(g),out=[];
  while(out.length<n){shuf(keys);var any=false;for(var i=0;i<keys.length&&out.length<n;i++){var x=g[keys[i]].pop();if(x){out.push(x);any=true}}if(!any)break}
  return shuf(out);
}
function startLabel(p){
  var ts={};p.forEach(function(x){ts[x.q.t]=1});
  var n=S.cfg.n&&S.cfg.n<p.length?S.cfg.n:p.length,t=Object.keys(ts).length;
  return 'Start: '+n+' question'+(n===1?'':'s')+' from '+t+' topic'+(t===1?'':'s')+' ('+p.length+' available)';
}
function topicFor(f,d){
  if(d.tn==='new'){
    var tt=(d.nt||'').trim();if(!tt){S.msg.push('Enter a name for the new topic.');return null}
    var ex=f.topics.filter(function(x){return x.title===tt})[0],tn;
    if(ex)tn=ex.no;else{tn=f.topics.reduce(function(m,x){return Math.max(m,x.no)},0)+1;f.topics.push({no:tn,title:tt})}
    d.tn=String(tn);d.nt='';return{tn:tn,tt:tt};
  }
  var tn2=+d.tn,tp=f.topics.filter(function(x){return x.no===tn2})[0];
  if(!tp){S.msg.push('Choose a topic.');return null}
  return{tn:tn2,tt:tp.title};
}
function nextN(f,tn){return Math.max.apply(null,[999].concat(f.qs.filter(function(x){return x.tn===tn}).map(function(x){return x.n})))+1}
function addQ(){
  var d=S.draft,f=S.files[d.mk];if(!f)return;
  var stem=(d.q||'').trim(),opts=[],k=-1;
  d.o.forEach(function(t,i){t=(t||'').trim();if(t){if(i===d.k)k=opts.length;opts.push(t)}});
  if(!stem||opts.length<2||k<0){S.msg.push('Enter the question, at least two options, and mark the correct one.');return}
  var tp=topicFor(f,d);if(!tp)return;
  var tn=tp.tn,tt=tp.tt,n=nextN(f,tn);
  f.qs.push({tn:tn,t:tt,n:n,q:stem,o:opts,k:k,u:1});
  persist();d.q='';d.o=['','','',''];d.k=-1;
  S.msg.push('Added to '+tt+' ('+f.label+'). Fill in the next one.');
}
function vAdd(){
  var ks=months(),d=S.draft,h='<h2>Add a question</h2>';
  if(!ks.length)return h+'<p class="sub">Import a question file first. New questions are added to a month and a topic.</p>';
  if(!d.mk||!S.files[d.mk])d.mk=ks[0];
  var f=S.files[d.mk];

/* ---------- quiz logic ---------- */
function build(list){
  return list.map(function(p){
    var q=p.q,perm=q.o.map(function(_,i){return i});
    if(Math.random()*100<S.cfg.sh&&canShuf(q)){for(var t=0;t<6;t++){shuf(perm);if(perm.some(function(v,i){return v!==i}))break}}
    return{q:q,mk:p.mk,perm:perm,sel:null,done:false,ok:false};
  });
}
function commit(it){
  if(it.done||it.sel===null)return;
  it.done=true;it.ok=it.perm[it.sel]===it.q.k;
  var id=it.mk+'.'+it.q.tn+'.'+it.q.n,h=S.hist[id]||(S.hist[id]={r:0,w:0,l:''});
  if(it.ok)h.r++;else h.w++;
  h.l=it.ok?'r':'w';
  sv('cq_hist',S.hist);syncRev(it);
}
function pick(pos){
  var z=S.qz,it=z.items[z.i];

  render();
}
function next(){
  var z=S.qz,it=z.items[z.i];

function syncRev(it){
  if(!it.done)return;
  var s=curSess(it.guess||!it.ok);if(!s)return;
  var id=it.mk+'.'+it.q.tn+'.'+it.q.n,ix=-1;
  s.items.forEach(function(r,i){if(r.id===id)ix=i});
  if(it.ok&&!it.guess){if(ix>=0)s.items.splice(ix,1);if(!s.items.length)S.rev.splice(S.rev.indexOf(s),1)}
  else{var e={id:id,t:it.q.t,q:it.q.q,ans:it.q.o[it.q.k],pick:it.q.o[it.perm[it.sel]],s:ix>=0?s.items[ix].s:'',why:it.ok?'guess':'wrong'};if(ix>=0)s.items[ix]=e;else s.items.push(e)}
  sv('cq_rev2',S.rev);
}

async function writeReview(){
  var list=[];S.rev.forEach(function(s){s.items.forEach(function(r){if(!r.s)list.push(r)})});
  if(!list.length||busy)return;

    for(var i=0;i<list.length;i+=15){
      var part=list.slice(i,i+15),pl=part.map(function(r,j){return{id:j,question:r.q,answer:r.ans}});
      var ask='Rewrite each quiz question and its correct answer as ONE short declarative sentence stating the fact, as a study note. Use the correct answer only and never mention a wrong choice. Keep every detail from the question. Example: question "BRICS Connect aims to strengthen which group\u2019s rights and cross-border portability of social security?" with answer "Gig workers" becomes "BRICS Connect aims to strengthen the rights and cross-border social security portability of gig workers." Return only a JSON array of {"id":number,"s":string}. Input: '+JSON.stringify(pl);
      var out=await sm.json(ask,{modelTier:'quick'});
      (Array.isArray(out)?out:[]).forEach(function(x){if(x&&part[x.id]&&x.s)part[x.id].s=String(x.s)});
      sv('cq_rev2',S.rev);
    }

  }catch(e){S.note=e&&e.code==='not_granted'?'Permission was declined, so notes show the question and answer only.':'Could not write statements just now. Use the button in the Review tab to retry.'}

  else if(a==='kapply'){
    var kp=S.kp,n=0;
    S.files[kp.mk].qs.forEach(function(q){var x=kp.map[q.tn+'.'+q.n];if(x!=null&&x<q.o.length){q.k=x;n++}});
    persist();S.msg.push('Saved '+n+' answers to '+S.files[kp.mk].label+'.');S.kp=null;
  }
  else if(a==='st'){c.st=v}
  else if(a==='cnt'){c.n=+v}
  else if(a==='fb'){c.fb=v}
  else if(a==='tall'){c.t={}}
  else if(a==='tnone'){topicList().forEach(function(x){c.t[x.t]=false})}
  else if(a==='start'){var p=draw(getPool(),c.n,c.ev);S.qz={items:build(p),i:0,over:false,sid:'s'+Date.now(),ts:Date.now()};window.scrollTo(0,0)}
  else if(a==='pin'){var tl=topicList(),tt=tl[+b.getAttribute('data-ti')].t;if(S.pins[tt])delete S.pins[tt];else S.pins[tt]=1;sv('cq_pins',S.pins)}
  else if(a==='bkexp'){bkExport();return}
  else if(a==='bkimp'){$('#file-b').click();return}
  else if(a==='even'){c.ev=!c.ev}
  else if(a==='timp'){$('#file-t').click();return}
  else if(a==='trep'){$('#file-r').click();return}
  else if(a==='texp'){exportTopic();return}
  else if(a==='addq'){addQ()}
  else if(a==='delq'){var dm=b.getAttribute('data-m'),dt=+b.getAttribute('data-tn'),dn=+b.getAttribute('data-n');S.files[dm].qs=S.files[dm].qs.filter(function(q){return!(q.u&&q.tn===dt&&q.n===dn)});persist()}
  else if(a==='cedit'){S.catEdit=!S.catEdit}
  else if(a==='catall'||a==='catnone'){var cn=b.getAttribute('data-cat');topicList().forEach(function(x){if(cn==='Pinned'?S.pins[x.t]:(!S.pins[x.t]&&catOf(x.t)===cn))c.t[x.t]=(a==='catall')})}
  else if(a==='tpin'){if(!Object.keys(S.pins).length)S.msg.push('Pin a topic first with the star.');else topicList().forEach(function(x){c.t[x.t]=!!S.pins[x.t]})}
  else if(a==='restore'){delete S.obs[b.getAttribute('data-id')];sv('cq_obs',S.obs)}
  else if(a==='guess'){var g0=S.qz.items[S.qz.i];g0.guess=!g0.guess;if(g0.done)syncRev(g0)}
  else if(a==='skip'){skip();return}
  else if(a==='obs'){obsc();return}
  else if(a==='rdl'){dl(b.getAttribute('data-id'));return}
  else if(a==='rwrite'){writeReview();return}
  else if(a==='rcopy'){if(navigator.clipboard)navigator.clipboard.writeText(revMd(findSess(b.getAttribute('data-id')))).then(function(){S.msg.push('Copied.');render()},function(){S.msg.push('Copy was blocked. Use Download.');render()});return}
  else if(a==='rclear'){if(confirm('Delete all review notes?')){S.rev=[];sv('cq_rev2',S.rev)}}
  else if(a==='rdel'){var did=b.getAttribute('data-id');if(confirm('Delete the notes for this session?')){S.rev=S.rev.filter(function(x){return x.id!==did});sv('cq_rev2',S.rev)}}
  else if(a==='pick'){pick(+b.getAttribute('data-i'));return}
  else if(a==='next'){next();return}
  else if(a==='end'){endSess();return}
  else if(a==='retry'){var m=S.qz.items.filter(function(x){return!x.ok}).map(function(x){return{q:x.q,mk:x.mk}});S.qz={items:build(shuf(m)),i:0,over:false,sid:'s'+Date.now(),ts:Date.now()};window.scrollTo(0,0)}
  else if(a==='done'){S.qz=null}
  render();
});
document.addEventListener('change',function(e){
  var t=e.target,c=S.cfg;
  if(t.hasAttribute&&t.hasAttribute('data-m')){c.m[t.getAttribute('data-m')]=t.checked;render()}
  else if(t.hasAttribute&&t.hasAttribute('data-ti')){c.t[topicList()[+t.getAttribute('data-ti')].t]=t.checked;render()}
  else if(t.id==='ncount'){render()}
  else if(t.hasAttribute&&t.hasAttribute('data-d')&&t.tagName==='SELECT'){if(t.getAttribute('data-d')==='mk')S.draft.tn='';render()}
  else if(t.hasAttribute&&t.hasAttribute('data-tc')){S.cat[topicList()[+t.getAttribute('data-tc')].t]=t.value;sv('cq_cat',S.cat);render()}
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.tagName==='DETAILS'&&d.hasAttribute('data-cat')){var n=d.getAttribute('data-cat');if(d.open)delete S.coll[n];else S.coll[n]=1;sv('cq_coll',S.coll)}},true);
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='shuf'){S.cfg.sh=+t.value;$('#shv').textContent=S.cfg.sh}
  else if(t.id==='ncount'){var v=parseInt(t.value,10);if(v>0){S.cfg.n=v;var sb=$('#startbtn');if(sb)sb.textContent=startLabel(getPool())}}
  else if(t.hasAttribute&&t.hasAttribute('data-d')){var f=t.getAttribute('data-d');if(f==='o')S.draft.o[+t.getAttribute('data-i')]=t.value;else S.draft[f]=f==='k'?+t.value:t.value}
});
document.addEventListener('keydown',function(e){
  if(!S.qz||S.qz.over||e.ctrlKey||e.metaKey||e.altKey)return;
  var it=S.qz.items[S.qz.i],k=e.key.toLowerCase(),i='abcdefgh'.indexOf(k);
  if(k==='g'){it.guess=!it.guess;if(it.done)syncRev(it);render();e.preventDefault();return}
  if(k==='s'){skip();e.preventDefault();return}
  if(i<0&&/^[1-8]$/.test(k))i=+k-1;
  if(i>=0&&i<it.perm.length){pick(i);e.preventDefault()}
  else if(k==='enter'&&e.target.tagName!=='BUTTON'){next();e.preventDefault()}
});
$('#file-q').addEventListener('change',function(e){
  var inp=e.target,fs=[].slice.call(inp.files);
  Promise.all(fs.map(function(f){return f.text().then(function(t){return[f.name,t]})})).then(function(a){
    a.forEach(function(x){
      var r=parseQ(x[1],x[0]);
      if(!r.qs.length){S.msg.push('No questions found in '+x[0]+'. Expected lines like **1.** and - (a).');return}
      var old=S.files[r.key];
      if(old){var om={};old.qs.forEach(function(q){om[q.tn+'.'+q.n]=q.k});r.qs.forEach(function(q){var v=om[q.tn+'.'+q.n];if(q.k<0&&v!=null&&v>=0)q.k=v})}
      if(old){old.qs.filter(function(q){return q.u}).forEach(function(q){var tp=r.topics.filter(function(x){return x.title===q.t})[0];if(!tp){tp={no:r.topics.reduce(function(m,x){return Math.max(m,x.no)},0)+1,title:q.t};r.topics.push(tp)}r.qs.push({tn:tp.no,t:q.t,n:q.n,q:q.q,o:q.o,k:q.k,u:1})})}
      if(old){var rt={};old.topics.forEach(function(x){if(x.rep)rt[x.title]=1});
        if(Object.keys(rt).length){r.qs=r.qs.filter(function(q){return q.u||!rt[q.t]});r.topics.forEach(function(x){if(rt[x.title])x.rep=1})}}
      S.files[r.key]={label:r.label,topics:r.topics,qs:r.qs};
      S.msg.push('Imported '+r.label+': '+r.qs.length+' questions in '+r.topics.length+' topics'+(function(){var kc=r.qs.filter(function(q){return q.k>=0}).length;return kc?', '+kc+' with answers':''})()+'.'+(r.warn.length?' Check: '+r.warn.slice(0,3).join('; ')+'.':''));
    });
    persist();inp.value='';S.tab='lib';render();
  });
});
$('#file-t').addEventListener('change',function(e){
  var inp=e.target,fs=[].slice.call(inp.files),d=S.draft,f=S.files[d.mk];
  if(!f||!fs.length)return;
  Promise.all(fs.map(function(x){return x.text()})).then(function(ts){
    var good=[],skip=0,dup=0;
    ts.forEach(function(t,i){parseQ(t,fs[i].name,true).qs.forEach(function(q){if(q.k>=0&&q.o.length>=2)good.push(q);else skip++})});
    inp.value='';
    if(!good.length){S.msg.push('No usable questions found. Each needs a **N.** line, options like - (a) text and an Answer: b line.'+(skip?' '+skip+' had no answer.':''));render();return}
    var tp=topicFor(f,d);if(!tp){render();return}
    var seen={};f.qs.forEach(function(q){if(q.tn===tp.tn)seen[q.q]=1});
    good.forEach(function(q){if(seen[q.q]){dup++;return}seen[q.q]=1;f.qs.push({tn:tp.tn,t:tp.tt,n:nextN(f,tp.tn),q:q.q,o:q.o,k:q.k,u:1})});
    persist();
    S.msg.push('Imported '+(good.length-dup)+' questions into '+tp.tt+' ('+f.label+').'+(skip?' Skipped '+skip+' with no answer.':'')+(dup?' Skipped '+dup+' duplicates.':''));
    render();
  });
});
$('#file-r').addEventListener('change',function(e){
  var inp=e.target,fl=inp.files[0],d=S.draft,f=S.files[d.mk];
  if(!f||!fl)return;
  fl.text().then(function(t){
    inp.value='';
    var good=[],skip=0;
    parseQ(t,fl.name,true).qs.forEach(function(q){if(q.k>=0&&q.o.length>=2)good.push(q);else skip++});
    if(!good.length){S.msg.push('No usable questions found, so nothing was changed. Each needs a **N.** line, options like - (a) text and an Answer: b line.');render();return}
    if(d.tn!=='new'){
      var tn0=+d.tn,tp0=f.topics.filter(function(x){return x.no===tn0})[0],cnt=f.qs.filter(function(q){return q.tn===tn0}).length;
      if(!tp0||!confirm('Replace the '+cnt+' questions in "'+tp0.title+'" with the '+good.length+' from this file? The old questions and their history will be deleted.'))return;
    }
    var tp=topicFor(f,d);if(!tp){render();return}
    f.qs.filter(function(q){return q.tn===tp.tn}).forEach(function(q){var id=d.mk+'.'+q.tn+'.'+q.n;delete S.hist[id];delete S.obs[id]});
    f.qs=f.qs.filter(function(q){return q.tn!==tp.tn});
    good.forEach(function(q,i){f.qs.push({tn:tp.tn,t:tp.tt,n:1000+i+1,q:q.q,o:q.o,k:q.k,u:1})});
    f.topics.forEach(function(x){if(x.no===tp.tn)x.rep=1});
    persist();sv('cq_hist',S.hist);sv('cq_obs',S.obs);
    S.msg.push('Replaced the questions in '+tp.tt+' ('+f.label+') with '+good.length+' from the file.'+(skip?' Skipped '+skip+' with no answer.':''));
    render();
  });
});
$('#file-b').addEventListener('change',function(e){
  var inp=e.target,f=inp.files[0];if(!f)return;
  f.text().then(function(t){
    var o;try{o=JSON.parse(t)}catch(x){o=null}
    inp.value='';
    if(!o||o.app!=='clat-drill'||!o.files){S.msg.push('That is not a CLAT Drill backup file.');render();return}
    var q=0;Object.keys(o.files).forEach(function(k){q+=o.files[k].qs.length});
    var rn=Array.isArray(o.rev)?o.rev.reduce(function(n,x){return n+x.items.length},0):0;
    if(!confirm('Replace everything in this browser with the backup from '+(o.saved||'unknown date').slice(0,10)+'? It holds '+q+' questions, '+Object.keys(o.hist||{}).length+' tried questions and '+rn+' review notes.'))return;
    bkApply(o);S.tab='lib';S.msg.push('Backup restored.');render();
  });
});
$('#file-k').addEventListener('change',function(e){
  var inp=e.target,f=inp.files[0],mk=S.keyFor;if(!f||!mk||!S.files[mk])return;
  f.text().then(function(t){
    var fl=S.files[mk],r=parseKey(t,fl.topics),m=0;
    fl.qs.forEach(function(q){var x=r.map[q.tn+'.'+q.n];if(x!=null&&x<q.o.length)m++});
    if(!r.count){S.msg.push('No answers found. Use lines like 1. b, 1-b, 1. (b) or a table of question number and letter.')}
    else S.kp={mk:mk,map:r.map,count:r.count,groups:r.groups,matched:m};
    inp.value='';render();
  });
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
})();
</script></body></html>
